name: build-bootstrap-per-bot
run-name: "Build ${{ inputs.bot_name }} by @${{ github.actor }}"

"on":
  workflow_dispatch:
    inputs:
      bot_name:
        description: "Nama bot (dipakai buat nama file hasil, misal: paidadz, seotask)"
        required: true
        type: string
      requirements_path:
        description: "Path relatif ke requirements.txt bot ini DI DALAM repo ini (misal: requirements/paidadz.txt)"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: ".exe"
          - os: ubuntu-latest
            ext: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 45 }}

    steps:
      - name: Checkout repo (bootstrap.py + requirements/)
        uses: actions/checkout@v4

      - name: Setup Python (pinned 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Pastikan requirements.txt bot ini ada
        shell: bash
        run: |
          if [ ! -f "${{ inputs.requirements_path }}" ]; then
            echo "❌ File tidak ditemukan: ${{ inputs.requirements_path }}"
            exit 1
          fi
          cp "${{ inputs.requirements_path }}" requirements.txt
          echo "isi requirements.txt untuk bot ${{ inputs.bot_name }}:"
          cat requirements.txt

      - name: Install dependencies (base + spesifik bot ini)
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard
          pip install requests colorama cryptography
          pip install -r requirements.txt

      - name: Build --include-package flags dari requirements.txt bot ini
        id: include_flags
        shell: bash
        run: |
          # Mapping nama pip -> nama import ASLI (Nuitka butuh nama import, bukan nama pip).
          # Tambahin baris baru di sini kalau nanti ketemu package lain yang beda nama.
          map_import_name() {
            case "$1" in
              pycryptodome) echo "Crypto" ;;
              Pillow|pillow) echo "PIL" ;;
              beautifulsoup4) echo "bs4" ;;
              python-dotenv) echo "dotenv" ;;
              PyYAML|pyyaml) echo "yaml" ;;
              opencv-python) echo "cv2" ;;
              *) echo "$1" ;;
            esac
          }

          FLAGS="--include-package=requests --include-package=colorama --include-package=cryptography"
          for pkg in $(grep -vE '^\s*#|^\s*$' requirements.txt); do
            import_name=$(map_import_name "$pkg")
            FLAGS="$FLAGS --include-package=$import_name"
          done
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Compile with Nuitka
        shell: bash
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads \
            ${{ steps.include_flags.outputs.flags }} \
            --output-filename=${{ inputs.bot_name }}${{ matrix.ext }} \
            bootstrap.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.bot_name }}-${{ matrix.os }}
          path: ${{ inputs.bot_name }}${{ matrix.ext }}